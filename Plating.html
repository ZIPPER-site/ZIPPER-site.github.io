    <div class="max-w-7xl mx-auto p-4 md:p-6">

            <h1 class="text-[clamp(1.4rem,3vw,2rem)] font-bold">拉头电镀产品价格表 The Price List of Plating Products</h1>
            <div class="text-gray-600 mt-1">单位：RMB 含税 | 更新日期：2026-03-20</div>
            <div class="mt-2 text-amber-600 text-sm">备注：黄色底色标注镀种，采用工业真金材料</div>
        </header>

        <!-- 搜索 -->
        <div class="mb-4">
            <input id="searchInput" type="text" placeholder="输入色卡编码 / 镀种名称搜索..."
                class="w-full border px-4 py-2 rounded-lg">
        </div>

        <!-- Tab切换 -->
        <div class="flex gap-2 mb-4">
            <button onclick="switchTab('rack')" id="tabRack" class="px-4 py-2 bg-blue-600 text-white rounded">挂镀 Rack（按件）</button>
            <button onclick="switchTab('barrel')" id="tabBarrel" class="px-4 py-2 bg-gray-200 rounded">滚镀 Barrel（元/KG）</button>
        </div>

        <!-- 挂镀表格 -->
        <div id="panelRack">
            <h2 class="text-lg font-semibold mb-2">挂镀产品 Rack Plating（单头/片、头带片）</h2>
            <div class="table-wrap">
                <table class="min-w-full border border-gray-300 text-sm">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border px-2 py-1">色卡编码</th>
                            <th class="border px-2 py-1">镀种名称</th>
                            <th class="border px-2 py-1">3#单头</th>
                            <th class="border px-2 py-1">3#头带片</th>
                            <th class="border px-2 py-1">5#单头</th>

                            <th class="border px-2 py-1">10#单头</th>
                            <th class="border px-2 py-1">10#头带片</th>
                        </tr>
                    </thead>
                    <tbody id="rackTbody">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 滚镀表格 -->
        <div id="panelBarrel" class="hidden">
            <h2 class="text-lg font-semibold mb-2">滚镀产品 Barrel Plating（元/KG）</h2>
            <div class="table-wrap">

function render(){
    const kw = document.getElementById("searchInput").value.toLowerCase();
    // 挂镀渲染
    const rackTbody = document.getElementById("rackTbody");
    rackTbody.innerHTML = "";
    rackData.forEach(item=>{
        const s = `${item.code} ${item.name}`.toLowerCase();
        if(!s.includes(kw)) return;
        const tr = document.createElement("tr");
        if(item.isGold) tr.className = "gold-row";
        tr.innerHTML = `
            <td class="border px-2 py-1">${item.code}</td>
            <td class="border px-2 py-1">${item.name}</td>
            <td class="border px-2 py-1">${item.r3}</td>
            <td class="border px-2 py-1">${item.t3}</td>

            <td class="border px-2 py-1">${item.t5}</td>
            <td class="border px-2 py-1">${item.r8}</td>
            <td class="border px-2 py-1">${item.t8}</td>
            <td class="border px-2 py-1">${item.r10}</td>
            <td class="border px-2 py-1">${item.t10}</td>
        `;
        rackTbody.appendChild(tr);
    })

    const barrelTbody = document.getElementById("barrelTbody");
    barrelTbody.innerHTML = "";

        if(!s.includes(kw)) return;

            <td class="border px-2 py-1">${item.idx}</td>
            <td class="border px-2 py-1">${item.code}</td>
            <td class="border px-2 py-1">${item.name}</td>
            <td class="border px-2 py-1">${item.price}</td>
        `;
        barrelTbody.appendChild(tr);
    })
}

// Tab切换
function switchTab(tab){
    currentTab = tab;
    if(tab==="rack"){
        document.getElementById("panelRack").classList.remove("hidden");
        document.getElementById("panelBarrel").classList.add("hidden");
        document.getElementById("tabRack").className="px-4 py-2 bg-blue-600 text-white rounded";
        document.getElementById("tabBarrel").className="px-4 py-2 bg-gray-200 rounded";
    }else{
        document.getElementById("panelRack").classList.add("hidden");
        document.getElementById("panelBarrel").classList.remove("hidden");
        document.getElementById("tabRack").className="px-4 py-2 bg-gray-200 rounded";
        document.getElementById("tabBarrel").className="px-4 py-2 bg-blue-600 text-white rounded";
    }
    render();
}

document.getElementById("searchInput").addEventListener("input",render);
render();
</script>
